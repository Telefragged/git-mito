[package]
name = "git-mito"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
btrfs-uapi = "0.13"
clap = { version = "4", features = ["derive"] }
gix = { version = "0.90", default-features = false, features = ["sha1", "revision"] }
nix = { version = "0.31", features = ["fs", "ioctl"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"
